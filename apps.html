<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Aplicaciones - Souldakr.io</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos.css">
    <style>
        .app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .app-btn { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 20px; border-radius: 10px; text-decoration: none; color: white; 
            font-weight: 600; transition: 0.3s; cursor: pointer; border: none; text-align: center;
        }
        .app-btn:hover { transform: scale(1.05); }
        .app-btn i { font-size: 30px; margin-bottom: 10px; }
        .app-btn span { font-size: 14px; }
        .app-1 { background: #3498db; }
        .app-2 { background: #e74c3c; }
        .app-3 { background: #2ecc71; }
        .app-4 { background: #f39c12; }

        /* Estilos de las Ventanas Flotantes */
        .window {
            position: fixed; 
            top: 10%; left: 10%; 
            width: 80%; height: 70%; 
            background: #0a0a0a; 
            border: 2px solid #6c5ce7; 
            border-radius: 10px; 
            z-index: 1000; 
            display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            resize: both; overflow: hidden;
            min-width: 300px; min-height: 200px;
        }
        .window-header {
            background: #1a1a1a; 
            padding: 10px; 
            cursor: move; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #333;
            user-select: none;
        }
        .window-title { color: white; font-weight: bold; font-size: 14px; }
        .window-controls button {
            background: transparent; border: none; color: white; cursor: pointer; 
            font-size: 16px; margin-left: 10px;
        }
        .window-controls .minimize:hover { color: #f1c40f; }
        .window-controls .close:hover { color: #e74c3c; }
        .window-content { flex-grow: 1; border: none; width: 100%; height: 100%; }
        
        /* Barra de tareas (Apps minimizadas) */
        .taskbar {
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: #1a1a1a; display: flex; padding: 5px; gap: 10px; 
            border-top: 2px solid #6c5ce7; z-index: 2000;
        }
        .taskbar-item {
            background: #333; color: white; padding: 5px 15px; border-radius: 5px; 
            cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px;
        }
        .taskbar-item:hover { background: #6c5ce7; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="card-container" style="text-align: center;">
        <div class="header-brand">
            <img src="logo.png" alt="Logo Souldakr">
            <span>Souldakr.io</span>
        </div>

        <h2>Mis Aplicaciones</h2>
        <p style="font-size: 14px; color: #666; margin-bottom: 20px;">Selecciona la aplicación que deseas abrir.</p>

        <div class="app-grid">
            <!-- Aseguramos que las URLs estén correctas y sean HTTPS -->
            <button class="app-btn app-1" onclick="openWindow('smtp', 'SMTP Checker', 'https://souldakr-io.onrender.com/')">
                <i class="fas fa-envelope"></i>
                <span>SMTP Checker</span>
            </button>
            <button class="app-btn app-2" onclick="openWindow('stripe', 'Checker Stripe', 'https://checkercc-7s1r.onrender.com/')">
                <i class="fas fa-credit-card"></i>
                <span>Checker Stripe</span>
            </button>
            <button class="app-btn app-3" onclick="alert('App 3 próximamente...')">
                <i class="fas fa-gamepad"></i>
                <span>App 3</span>
            </button>
            <button class="app-btn app-4" onclick="alert('App 4 próximamente...')">
                <i class="fas fa-globe"></i>
                <span>App 4</span>
            </button>
        </div>

        <div class="links" style="margin-top: 30px;">
            <a href="dashboard.html">Volver al Dashboard</a>
        </div>
    </div>

    <!-- Contenedor de Ventanas -->
    <div id="windows-container"></div>
    
    <!-- Barra de Tareas -->
    <div id="taskbar" class="taskbar hidden"></div>

    <script type="module">
        import { checkUserAccess, checkSession } from './i.js';
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        const auth = getAuth();
        let windowCount = 0;

        // Validación de acceso al cargar la página
        onAuthStateChanged(auth, async (user) => {
            if (!user) { 
                window.location.href = 'login.html'; 
                return; 
            }
            
            checkSession();
            const status = await checkUserAccess();
            
            if (!status || (!status.hasPlan && !status.isAdmin)) {
                alert('No tienes un plan activo o ha expirado.'); 
                window.location.href = 'plan.html';
            }
        });

        // Función para crear una ventana flotante de forma segura
        window.openWindow = (id, title, url) => {
            const existing = document.getElementById(`win-${id}`);
            if (existing) {
                existing.style.display = 'flex';
                existing.style.zIndex = ++windowCount;
                return;
            }

            const win = document.createElement('div');
            win.id = `win-${id}`;
            win.className = 'window';
            win.style.zIndex = ++windowCount;
            
            // Posición en cascada para no superponerse
            win.style.top = `${10 + (windowCount * 2)}%`;
            win.style.left = `${10 + (windowCount * 2)}%`;

            // SEGURIDAD: Se añade el atributo sandbox al iframe.
            // Evita que la web externa robe datos de sesión o redirija la ventana principal.
            win.innerHTML = `
                <div class="window-header" onmousedown="startDrag(event, 'win-${id}')">
                    <span class="window-title">${title}</span>
                    <div class="window-controls">
                        <button class="minimize" onclick="minimizeWindow('win-${id}')"><i class="fas fa-minus"></i></button>
                        <button class="close" onclick="closeWindow('win-${id}')"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <iframe class="window-content" src="${url}" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
            `;
            document.getElementById('windows-container').appendChild(win);
        };

        // Minimizar ventana a la barra de tareas
        window.minimizeWindow = (id) => {
            const win = document.getElementById(id);
            if (win) win.style.display = 'none';
            
            const taskbar = document.getElementById('taskbar');
            if (!document.getElementById(`task-${id}`)) {
                const task = document.createElement('div');
                task.id = `task-${id}`;
                task.className = 'taskbar-item';
                task.innerHTML = `<i class="fas fa-window-restore"></i> ${id.replace('win-', '')}`;
                task.onclick = () => {
                    win.style.display = 'flex';
                    win.style.zIndex = ++windowCount;
                    task.remove();
                    if (taskbar.children.length === 0) taskbar.classList.add('hidden');
                };
                taskbar.appendChild(task);
                taskbar.classList.remove('hidden');
            }
        };

        // Cerrar ventana
        window.closeWindow = (id) => {
            const win = document.getElementById(id);
            if (win) win.remove();
            
            const task = document.getElementById(`task-${id}`);
            if (task) {
                task.remove();
                if (document.getElementById('taskbar').children.length === 0) {
                    document.getElementById('taskbar').classList.add('hidden');
                }
            }
        };

        // Lógica de arrastre (Drag & Drop)
        let dragTarget = null;
        let offsetX = 0, offsetY = 0;

        window.startDrag = (e, id) => {
            dragTarget = document.getElementById(id);
            dragTarget.style.zIndex = ++windowCount;
            offsetX = e.clientX - dragTarget.getBoundingClientRect().left;
            offsetY = e.clientY - dragTarget.getBoundingClientRect().top;
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
            e.preventDefault();
        };

        function drag(e) {
            if (!dragTarget) return;
            dragTarget.style.left = `${e.clientX - offsetX}px`;
            dragTarget.style.top = `${e.clientY - offsetY}px`;
        }

        function stopDrag() {
            dragTarget = null;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDrag);
        }
    </script>
</body>
</html>
