<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Souldakr</title>
    <link rel="stylesheet" href="../../../estilos.css">
    <style>
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .admin-table th { background-color: #f8f9fa; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card-container page-wide">
        <div id="login-screen">
            <h2>Panel de Administración</h2>
            <p>Inicia sesión con tu cuenta de administrador de Firebase.</p>
            <div class="input-group">
                <label>Correo</label>
                <input type="email" id="admin-email-input">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="admin-password-input">
            </div>
            <button class="btn-submit" onclick="loginAdmin()">Acceder</button>
            <div id="login-message" class="message"></div>
        </div>

        <div id="panel-screen" class="hidden">
            <div class="top-bar">
                <a href="../../../dashboard.html" class="btn-back">Volver</a>
                <button class="btn-profile" onclick="logoutUser()">Salir</button>
            </div>
            <h2>Historial de Transacciones</h2>
            <table class="admin-table">
                <thead>
                    <tr><th>Usuario</th><th>Plan</th><th>Monto</th><th>Referencia</th><th>Estado / Acción</th></tr>
                </thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { loadAdminPayments, approvePayment, rejectPayment } from '../../../i.js';

        const auth = getAuth();
        
        window.loginAdmin = async () => {
            const email = document.getElementById('admin-email-input').value;
            const pass = document.getElementById('admin-password-input').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                document.getElementById('login-message').textContent = "Credenciales incorrectas.";
                document.getElementById('login-message').className = "message error";
            }
        };

        // Verificación real de sesión de Firebase
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Aquí podrías verificar si el usuario tiene el rol de admin en tu base de datos
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('panel-screen').classList.remove('hidden');
                loadAdminPayments();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('panel-screen').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
