<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Souldakr.io</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="card-container">
        <div class="header-brand">
            <img src="logo.png" alt="Logo Souldakr">
            <span>Souldakr.io</span>
        </div>

        <h2>Recuperar contraseña</h2>
        <p style="text-align: center; font-size: 13px; color: #666; margin-bottom: 20px;">Ingresa tu correo para enviarte un enlace.</p>

        <div class="input-group">
            <label>Correo electrónico</label>
            <input type="email" id="reset-email" placeholder="tu@correo.com">
        </div>

        <button class="btn-submit" id="reset-btn">Enviar enlace</button>
        <div class="links"><a href="login.html">Volver al inicio de sesión</a></div>
        <div id="message-box" class="message"></div>
    </div>

    <script type="module">
        import { recoverPassword } from './i.js';
        document.getElementById('reset-btn').addEventListener('click', recoverPassword);
    </script>
</body>
</html>
