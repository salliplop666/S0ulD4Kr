<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Souldakr.io</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="card-container">
        <div class="header-brand">
            <img src="logo.png" alt="Logo Souldakr">
            <span>Souldakr.io</span>
        </div>

        <h2>Crear cuenta</h2>

        <div class="input-group">
            <label>Nombre completo</label>
            <input type="text" id="reg-name" placeholder="Tu nombre">
        </div>

        <div class="input-group">
            <label>Número de teléfono</label>
            <div class="phone-container">
                <select id="reg-country-code">
                    <option value="+1">+1</option>
                    <option value="+54">+54</option>
                    <option value="+57">+57</option>
                    <option value="+58">+58</option>
                    <option value="+52">+52</option>
                </select>
                <input type="tel" id="reg-phone" placeholder="Número de teléfono">
            </div>
        </div>

        <div class="input-group">
            <label>Correo electrónico (Recibirás el código aquí)</label>
            <input type="email" id="reg-email" placeholder="tu@correo.com">
        </div>

        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres">
        </div>

        <div class="input-group">
            <label>Confirma tu contraseña</label>
            <input type="password" id="reg-confirm-password" placeholder="Repite tu contraseña">
        </div>

        <button class="btn-submit" id="register-btn">Crear cuenta</button>

        <div class="links">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </div>

        <div id="message-box" class="message"></div>
    </div>

    <script type="module">
        import { registerUser } from './i.js';
        document.getElementById('register-btn').addEventListener('click', registerUser);
    </script>
</body>
</html>
